name: Build Cloudstream Extension

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Set ANDROID_HOME
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "SDK_DIR=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Build extension
        run: gradle make

      - name: Collect cs3 files
        run: |
          mkdir -p repo
          find . -name "*.cs3" -exec cp {} repo/ \;
          echo "Files in repo:"; ls repo/

      - name: Push to repo branch
        run: |
          cd repo
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -b repo
          git add .
          git commit -m "Build: NguonCProvider.cs3"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push origin repo --force
